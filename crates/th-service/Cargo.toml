[package]
name = "th-service"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
humantime = "2.4.0"
log = { version = "0.4.34", features = ["std"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
th-core = { version = "0.1.0", path = "../th-core" }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
zeroize = "1.9.1"

[target."cfg(windows)".dependencies]
windows-service = "0.8.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Memory", "Win32_System_Threading", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_System_Services", "Win32_System_Pipes", "Win32_NetworkManagement_WindowsFilteringPlatform", "Win32_System_Rpc", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_Networking_WinSock"] }

[dev-dependencies]
async-trait = "0.1.92"
tempfile = "3.27.0"
th-core = { path = "../th-core", features = ["testing"] }
zeroize = "1.9.1"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[features]
# Dev builds only: lift a kill-switch engage nobody confirmed after 120 s. Release builds must
# never contain it; CI checks the release binary for the timer's marker string.
dev-safety = []
