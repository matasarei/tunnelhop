[package]
name = "th-service"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
humantime = "2.4.0"
log = { version = "0.4.34", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
th-core = { version = "0.1.0", path = "../th-core" }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time"] }
zeroize = "1.9.1"

[target."cfg(windows)".dependencies]
windows-service = "0.8.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_Pipes"] }

[dev-dependencies]
tempfile = "3.27.0"
