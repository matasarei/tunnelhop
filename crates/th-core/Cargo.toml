[package]
name = "th-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Test doubles for drivers, kill-switch and probe (used by this crate's tests and the service's).
testing = []

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", default-features = false, features = ["sync"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
jsonschema = { version = "0.58.5", default-features = false }
proptest = "1.11.0"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["macros", "rt", "time"] }
th-core = { path = ".", features = ["testing"] }
