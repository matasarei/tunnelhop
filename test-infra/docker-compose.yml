# TunnelHop test servers, run by Docker Desktop on the PC. The test VM reaches them through the
# lab switch: the VPN servers at 192.168.77.1, the "what's my IP" endpoint at 198.18.77.2,
# an address the PC also holds on th-lab but that is not on the lab subnet (see README.md).
# Ports are published on those lab addresses only, never on the PC's other networks, so the
# th-lab switch (DEVELOPMENT.md section 2) must exist before `up`.
# WireGuard is published on 41820 and 41821: Windows reserves blocks of the dynamic range
# (49152 and up) for Hyper-V and WinNAT, and 51820/51821 often fall inside one.
# See README.md.
#
#   docker compose run --rm gen     # once: keys, server configs (data/) and client configs (out/)
#   docker compose up -d --build    # the servers
#
# Each server NATs its tunnel out through its own fixed address on the `lab` network and sends
# probe requests that arrive through its tunnel straight to `whatsmyip`, which therefore sees
# that server's address; a request without a tunnel arrives through Docker's port proxy instead.

x-server: &server
  build: .
  cap_add: [NET_ADMIN]
  sysctls:
    net.ipv4.ip_forward: "1"
  restart: unless-stopped

x-probe: &probe
  PROBE_ADDRESS: ${PROBE_ADDRESS:-198.18.77.2}
  WHATSMYIP: 172.31.77.10

services:
  wg-a:
    <<: *server
    command: [wg]
    environment:
      <<: *probe
      TUNNEL_ADDRESS: 10.77.1.1/24
      TUNNEL_SUBNET: 10.77.1.0/24
    volumes: ["./data/wg-a:/data:ro"]
    ports: ["${SERVER_ADDRESS:-192.168.77.1}:41820:51820/udp"]
    networks:
      lab: { ipv4_address: 172.31.77.11 }

  wg-b:
    <<: *server
    command: [wg]
    environment:
      <<: *probe
      TUNNEL_ADDRESS: 10.77.2.1/24
      TUNNEL_SUBNET: 10.77.2.0/24
    volumes: ["./data/wg-b:/data:ro"]
    ports: ["${SERVER_ADDRESS:-192.168.77.1}:41821:51821/udp"]
    networks:
      lab: { ipv4_address: 172.31.77.12 }

  ovpn:
    <<: *server
    command: [ovpn]
    environment:
      <<: *probe
      TUNNEL_SUBNET: 10.77.3.0/24
    devices: ["/dev/net/tun:/dev/net/tun"]
    volumes: ["./data/ovpn:/data:ro"]
    ports: ["${SERVER_ADDRESS:-192.168.77.1}:1194:1194/udp"]
    networks:
      lab: { ipv4_address: 172.31.77.13 }

  # Answers every request with the caller's source address.
  whatsmyip:
    build: .
    command: [whatsmyip]
    ports: ["${PROBE_ADDRESS:-198.18.77.2}:8080:8080/tcp"]
    restart: unless-stopped
    networks:
      lab: { ipv4_address: 172.31.77.10 }

  gen:
    build: .
    entrypoint: [/usr/local/bin/gen.sh]
    environment:
      SERVER_ADDRESS: ${SERVER_ADDRESS:-192.168.77.1}
      FORCE: ${FORCE:-0}
    volumes: ["./:/infra"]
    profiles: [gen]
    network_mode: none

networks:
  lab:
    ipam:
      config:
        - subnet: 172.31.77.0/24
