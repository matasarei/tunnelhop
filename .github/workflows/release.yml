name: Release

# A tag `v<version>` builds the installer (app + service) and attaches it to a draft GitHub
# Release. Nothing is published from here: a person reads the draft and publishes it. The
# version in the tag must be the one the three manifests carry, so a release never ships a
# binary that says another version. How to cut one: docs/DEVELOPMENT.md, "Cutting a release".

on:
  push:
    tags: ["v*"]

# Read only, except the small job that creates the release: the build, which runs npm and
# cargo build scripts, never holds a token that can write.
permissions:
  contents: read

# Two pushes of the same tag never build side by side; a release is never cancelled halfway.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  installer:
    name: installer (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        # Nothing here pushes.
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        # The version the app is developed and tested with, not whatever the runner ships.
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: The tag matches the manifests' version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          tauri=$(node -p 'require("./app/src-tauri/tauri.conf.json").version')
          npm=$(node -p 'require("./app/package.json").version')
          echo "tag $tag, Cargo.toml $cargo, tauri.conf.json $tauri, package.json $npm"
          if [ "$tag" != "$cargo" ] || [ "$tag" != "$tauri" ] || [ "$tag" != "$npm" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the version in every manifest"; exit 1
          fi

      - name: Install the frontend's dependencies
        working-directory: app
        run: npm ci

      # The installer ships THIRD-PARTY-NOTICES*; they must match this commit's Cargo.lock,
      # package-lock.json and toolchain. Needs node_modules, for the npm packages' licences.
      - name: The third-party notices are current
        run: |
          cargo install cargo-about --locked --version 0.9.2 --features cli
          node scripts/third-party-notices.mjs --check

      - name: Build the frontend
        working-directory: app
        run: npm run build

      # A release tags the merge commit GitHub made on main, which no pre-push hook has tested.
      # The app embeds the built frontend, so this comes after the step above.
      - name: Tests
        run: cargo test --workspace

      - name: Build the installer
        working-directory: app
        run: npm run installer

      # The release gate proves this on every service change; checked again on the very binary
      # that ships.
      - name: The service carries no dev safety timer
        run: |
          if grep -q -a TUNNELHOP_DEV_SAFETY_TIMER target/release/th-service.exe; then
            echo "::error::the release build contains the dev safety timer"; exit 1
          fi

      - name: Checksum
        working-directory: target/release/bundle/nsis
        run: |
          installer="TunnelHop_${GITHUB_REF_NAME#v}_x64-setup.exe"
          test -f "$installer" || { ls -la; echo "::error::$installer was not built"; exit 1; }
          sha256sum "$installer" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer
          path: |
            target/release/bundle/nsis/TunnelHop_*_x64-setup.exe
            target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  draft:
    name: draft release
    needs: installer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: installer

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "TunnelHop_${GITHUB_REF_NAME#v}_x64-setup.exe" \
            SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes \
            --title "TunnelHop $GITHUB_REF_NAME"
