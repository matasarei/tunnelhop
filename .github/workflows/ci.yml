name: CI

# Only what a developer's machine cannot vouch for runs here; the full check (fmt, clippy, every
# test, the app's type check) runs locally before each push, in .githooks/pre-push. This job
# proves th-core still builds and passes off Windows, where nobody develops. The release-safety
# gate is release-gate.yml.

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the run still going for the previous one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core-linux:
    name: th-core (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p th-core --all-targets -- -D warnings
      - run: cargo test -p th-core
