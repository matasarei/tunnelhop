name: CI

# Only what a developer's machine cannot vouch for runs here; the full check (fmt, clippy, every
# test, the app's type check) runs locally before each push, in .githooks/pre-push. This job
# proves th-core still builds and passes off Windows (on a Linux runner, the cheapest), so the core
# stays free of platform code. TunnelHop itself is Windows-only. The release-safety
# gate is release-gate.yml.

on:
  push:
    branches: [main]
  pull_request:

# Read the code, nothing more: a pull request from a fork runs this too.
permissions:
  contents: read

# A new push supersedes the run still going for the previous one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core-portable:
    name: th-core (platform-independent)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        # Nothing here pushes, so the token is not left in .git/config.
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy -p th-core --all-targets -- -D warnings
      - run: cargo test -p th-core
